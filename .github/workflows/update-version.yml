name: Auto Update version.json on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION_CODE: ${{ github.event.release.id }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import json
          import os

          tag_name = os.environ["TAG_NAME"]
          version_name = tag_name[1:] if tag_name.startswith("v") else tag_name
          version_code = int(os.environ["VERSION_CODE"])
          changelog = os.environ.get("RELEASE_BODY", "")
          changelog = changelog.replace("\r\n", "\n").replace("\n", " ").strip()

          data = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": "https://github.com/zaidikamil-web/Be-Smart-App/releases/latest/download/be-smart-app.apk",
              "changelog": changelog,
          }

          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git add version.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update version.json for release ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
