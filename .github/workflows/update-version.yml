name: Auto Update version.json on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update version.json
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${TAG_NAME#v}"
          VERSION_CODE="${{ github.event.release.id }}"
          CLEAN_BODY=$(echo "${{ github.event.release.body }}" | tr '\n' ' ')

          cat <<EOF > version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$CLEAN_VERSION",
            "apkUrl": "https://github.com/zaidikamil-web/Be-Smart-App/releases/latest/download/be-smart-app.apk",
            "changelog": "$CLEAN_BODY"
          }
          EOF

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: version.json
          commit_message: "Auto-update version.json for release ${{ github.event.release.tag_name }}"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions@github.com"
